name: 'Terraform PR Validation'

# Trigger the workflow only on Pull Requests targeting the main branch
on:
  pull_request:
    branches:
      - main

# These permissions are REQUIRED for OIDC authentication to work securely
permissions:
  id-token: write # Allows GitHub to request the OIDC JWT token
  contents: read  # Allows the action to checkout the code

jobs:
  terraform:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    
    # We set the working directory to our dev environment for this phase
    defaults:
      run:
        working-directory: ./environments/dev

    steps:
      # 1. Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug GitHub Context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"

      # 2. Configure AWS Credentials using OIDC (No permanent passwords!)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::080050138686:role/github-actions-ci-role # REPLACE THIS!
          aws-region: us-east-1

      # 3. Install the correct version of Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      # 4. Check formatting (Fails the build if code isn't formatted properly)
      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive ../../

      # 5. Initialize the Terraform backend (Downloads providers and connects to S3)
      - name: Terraform Init
        id: init
        run: terraform init

      # 6. Validate the syntax and configuration
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # 7. Generate a speculative execution plan
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: false